name: Deploy NeuroFlux to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::245908835379:role/NeuroFluxGitHubDeploymentRole
          aws-region: ap-south-1

      - name: Deploy to EC2 through SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e72c552ca1251ccd" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NeuroFlux from GitHub Actions" \
            --parameters 'commands=["cd /home/ubuntu/AWS_Deployment && ./deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e72c552ca1251ccd"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e72c552ca1251ccd" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0e72c552ca1251ccd" \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

          echo "Deployment successful."
